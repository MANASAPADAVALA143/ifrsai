# Or:
#   python -m pytest -m ifrs15_standing test_ifrs15_multi_pob_regressions.py test_ifrs15_const_dxb014_fixes.py test_ifrs15_creek_harbour_fixes.py test_ifrs15_rpo_bucketing.py test_ifrs15_gating_shapes.py -q
addopts = --ignore=scripts --ignore=test_rag_isolation.py
markers =
    ifrs15_standing: CONST/Creek Harbour/multi-POB IFRS 15 regressions (required on module changes)
